<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XBOT P20 动态策略交易配置方案预览</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #0b0b0e;
      --panel: #111116;
      --panel-2: #15151b;
      --panel-3: #0e0e12;
      --line: #292930;
      --line-soft: #202026;
      --text: #f0f0f4;
      --muted: #9696a2;
      --quiet: #686873;
      --accent: #8060f4;
      --accent-soft: rgba(128, 96, 244, .14);
      --cyan: #76d8ee;
      --green: #17e99a;
      --amber: #f1bd4d;
      --red: #ff6b78;
      --radius: 6px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--text); background: var(--bg); font: 13px/1.5 Inter, "Microsoft YaHei", system-ui, sans-serif; }
    button, input, select { font: inherit; }
    button { color: inherit; cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 218px minmax(0, 1fr); }
    .sidebar { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: #09090c; }
    .brand { height: 65px; display: flex; align-items: center; gap: 10px; padding: 0 22px; border-bottom: 1px solid var(--line); font-size: 17px; font-weight: 760; }
    .brand-mark { display: grid; place-items: center; width: 26px; height: 26px; border: 1px solid #6550c7; border-radius: 6px; color: #c0b4ff; font-size: 11px; }
    .nav { display: grid; gap: 4px; padding: 18px 12px; }
    .nav button { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 0; border-left: 2px solid transparent; background: transparent; color: var(--muted); text-align: left; }
    .nav button.active { border-left-color: var(--accent); background: rgba(128, 96, 244, .08); color: var(--text); }
    .nav i { width: 17px; color: var(--accent); }
    .engine { margin-top: auto; padding: 16px; border-top: 1px solid var(--line); color: var(--amber); font-size: 12px; }
    .engine span { display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: currentColor; }
    main { min-width: 0; padding: 24px 30px 40px; }
    .page { width: min(1180px, 100%); margin: 0 auto; }
    .topline, .workspace-head, .panel-head, .section-head, .toolbar, .footer-actions, .notice, .template-line, .chain-card-head { display: flex; align-items: center; }
    .topline, .workspace-head, .panel-head, .section-head, .toolbar, .footer-actions, .template-line, .chain-card-head { justify-content: space-between; gap: 16px; }
    .eyebrow { color: #aa94ff; font-size: 12px; font-weight: 700; }
    h1, h2, h3, p { margin: 0; }
    h1 { margin-top: 3px; font-size: 27px; letter-spacing: 0; }
    h2 { font-size: 18px; }
    h3 { font-size: 16px; }
    .subtitle, .panel-head p, .section-head p { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .top-actions { display: flex; align-items: center; gap: 14px; color: var(--muted); white-space: nowrap; }
    .status-dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--green); }
    .icon-button { display: inline-grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--muted); }
    .icon-button:hover { border-color: #514d60; color: white; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 13px; border: 0; background: transparent; color: var(--muted); }
    .workspace-head { align-items: flex-start; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .workspace-head .meta { margin-top: 5px; color: var(--muted); }
    .workspace-head .meta strong { color: var(--text); }
    .badge { padding: 4px 8px; border: 1px solid rgba(23, 233, 154, .34); border-radius: var(--radius); color: var(--green); font-size: 11px; white-space: nowrap; }
    .steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 18px 0; border: 1px solid var(--line); background: var(--panel); }
    .step { min-height: 68px; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); text-align: left; }
    .step:last-child { border-right: 0; }
    .step .num { display: grid; place-items: center; width: 25px; height: 25px; border: 1px solid var(--line); border-radius: 50%; color: var(--quiet); font-size: 11px; }
    .step strong, .step small { display: block; }
    .step strong { color: var(--text); font-size: 12px; }
    .step small { margin-top: 2px; color: var(--quiet); font-size: 10px; }
    .step.active { background: var(--accent-soft); }
    .step.active .num { border-color: rgba(128, 96, 244, .7); background: var(--accent); color: white; }
    .shell { overflow: hidden; border: 1px solid var(--line); background: var(--panel); }
    .shell-head { padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .workspace-grid { display: grid; grid-template-columns: minmax(0, 1.42fr) minmax(280px, .78fr); gap: 18px; padding: 18px; }
    .panel { border: 1px solid var(--line); background: var(--panel-3); }
    .panel-head { min-height: 57px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
    .panel-head span { color: var(--quiet); font-size: 11px; }
    .panel-body { padding: 15px; }
    .button { min-height: 35px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 13px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-2); color: var(--text); }
    .button:hover { filter: brightness(1.15); }
    .button.primary { border-color: var(--accent); background: var(--accent); color: white; }
    .button.ghost { background: transparent; color: var(--muted); }
    .button.small { min-height: 29px; padding: 0 9px; font-size: 11px; }
    .template-line { align-items: flex-end; padding-bottom: 15px; border-bottom: 1px solid var(--line-soft); }
    .field { min-width: 0; display: grid; gap: 5px; }
    .field > span, label > span { color: var(--muted); font-size: 11px; }
    .select, .input { width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius); outline: none; background: var(--panel-2); color: var(--text); }
    .select:focus, .input:focus { border-color: rgba(128, 96, 244, .8); }
    .template-line .field { flex: 1; }
    .template-actions { display: flex; gap: 7px; }
    .preset-row { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0; }
    .preset { min-height: 29px; padding: 0 9px; border: 1px solid var(--line); border-radius: 5px; background: transparent; color: var(--muted); font-size: 11px; }
    .preset:hover, .preset.active { border-color: rgba(118, 216, 238, .48); background: rgba(118, 216, 238, .08); color: var(--cyan); }
    .chain-table { overflow: hidden; border: 1px solid var(--line); }
    .chain-row { display: grid; grid-template-columns: 24px minmax(105px, 1.05fr) minmax(110px, 1fr) minmax(110px, 1fr) 70px; align-items: center; gap: 10px; min-height: 62px; padding: 9px 11px; border-bottom: 1px solid var(--line-soft); }
    .chain-row:last-child { border-bottom: 0; }
    .chain-row.header { min-height: 35px; color: var(--quiet); background: rgba(255,255,255,.02); font-size: 10px; }
    .chain-row.off { opacity: .48; }
    .check { width: 16px; height: 16px; accent-color: var(--accent); }
    .chain-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .chain-mark { display: grid; place-items: center; width: 26px; height: 26px; flex: 0 0 26px; border: 1px solid var(--line); border-radius: 5px; color: var(--cyan); font-size: 9px; font-weight: 700; }
    .chain-name strong, .chain-name small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chain-name small { color: var(--quiet); font-size: 10px; }
    .chain-row label { min-width: 0; }
    .chain-row .input { height: 32px; font-family: ui-monospace, monospace; font-size: 12px; }
    .unit { position: relative; }
    .unit em { position: absolute; top: 8px; right: 9px; color: var(--quiet); font-size: 10px; font-style: normal; pointer-events: none; }
    .unit .input { padding-right: 42px; }
    .row-status { color: var(--green); font-size: 10px; text-align: right; white-space: nowrap; }
    .row-status.pending { color: var(--amber); }
    .section { margin-top: 17px; padding-top: 16px; border-top: 1px solid var(--line); }
    .section-head { align-items: flex-start; margin-bottom: 12px; }
    .section-head h3 { font-size: 14px; }
    .section-head span { color: var(--cyan); font-size: 11px; }
    .rule-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .rule { min-height: 68px; padding: 11px; border: 1px solid var(--line); background: var(--panel); }
    .rule span, .rule strong { display: block; }
    .rule span { color: var(--quiet); font-size: 10px; }
    .rule strong { margin-top: 7px; font-size: 13px; }
    .rule small { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .summary-list { display: grid; gap: 0; }
    .summary-list > div { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
    .summary-list > div:last-child { border-bottom: 0; }
    .summary-list span { color: var(--quiet); font-size: 11px; }
    .summary-list strong { max-width: 65%; color: var(--text); font-size: 12px; text-align: right; }
    .notice { align-items: flex-start; margin-top: 14px; padding: 10px 11px; border: 1px solid rgba(128, 96, 244, .3); border-radius: var(--radius); background: var(--accent-soft); color: var(--muted); font-size: 11px; }
    .notice i { flex: 0 0 auto; color: #aa94ff; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 15px 18px; border-top: 1px solid var(--line); }
    .footer small { color: var(--quiet); }
    .footer-actions { gap: 8px; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 10; display: none; max-width: 320px; padding: 11px 13px; border: 1px solid rgba(23, 233, 154, .35); border-radius: var(--radius); background: #101a18; color: var(--green); box-shadow: 0 12px 30px rgba(0,0,0,.3); }
    .toast.show { display: block; }

    /* Scheme A uses one matrix editor; templates only apply chain values. */
    .exit-presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .exit-option { position: relative; min-height: 72px; padding: 12px 34px 11px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); text-align: left; }
    .exit-option:hover, .exit-option.active { border-color: rgba(23, 233, 154, .55); background: rgba(23, 233, 154, .06); }
    .exit-option strong, .exit-option span { display: block; }
    .exit-option strong { font-size: 12px; }
    .exit-option span { margin-top: 5px; color: var(--muted); font-size: 10px; }
    .exit-option i { position: absolute; top: 12px; right: 11px; display: none; color: var(--green); }
    .exit-option.active i { display: block; }
    .draft-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 11px; padding: 11px; border: 1px solid var(--line); background: var(--panel); }
    .draft-summary span, .draft-summary strong { display: block; }
    .draft-summary span { color: var(--quiet); font-size: 10px; }
    .draft-summary strong { margin-top: 4px; font-size: 12px; }
    .custom-condition { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 9px; padding: 9px 11px; border: 1px solid var(--line-soft); color: var(--muted); font-size: 10px; }
    .preview-label { display: inline-flex; align-items: center; gap: 7px; margin: 0 0 14px; color: var(--muted); font-size: 11px; }
    .preview-label b { color: var(--text); font-weight: 600; }

    @media (max-width: 980px) {
      .app { grid-template-columns: 72px minmax(0, 1fr); }
      .brand { justify-content: center; padding: 0; }
      .brand-label, .nav-label, .engine-label { display: none; }
      .nav button { justify-content: center; padding: 11px; }
      .engine { text-align: center; }
      main { padding: 20px 16px 32px; }
      .workspace-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 680px) {
      .topline, .workspace-head, .shell-head, .template-line, .footer { align-items: flex-start; flex-direction: column; }
      .top-actions, .template-actions, .footer-actions { width: 100%; }
      .top-actions, .footer-actions { justify-content: space-between; }
      .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .step:nth-child(2) { border-right: 0; }
      .step:nth-child(n + 3) { border-top: 1px solid var(--line); }
      .chain-row { grid-template-columns: 24px minmax(92px, 1fr) minmax(92px, 1fr); gap: 8px; }
      .chain-row.header { display: none; }
      .chain-row > :nth-child(4) { grid-column: 2; }
      .chain-row > :nth-child(5) { grid-column: 3; grid-row: 2; }
      .chain-row { min-height: 91px; }
      .rule-grid, .chain-card-body { grid-template-columns: 1fr; }
      .chain-card-meta { gap: 8px; font-size: 10px; }
      .summary-list strong { max-width: 58%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">XB</span><span class="brand-label">xbot.</span></div>
      <nav class="nav">
        <button><i data-lucide="layout-dashboard"></i><span class="nav-label">总览</span></button>
        <button class="active"><i data-lucide="layers-3"></i><span class="nav-label">策略中心</span></button>
        <button><i data-lucide="users"></i><span class="nav-label">KOL</span></button>
        <button><i data-lucide="radio"></i><span class="nav-label">信号</span></button>
        <button><i data-lucide="chart-candlestick"></i><span class="nav-label">持仓</span></button>
        <button><i data-lucide="scroll-text"></i><span class="nav-label">交易记录</span></button>
        <button><i data-lucide="settings"></i><span class="nav-label">设置</span></button>
      </nav>
      <div class="engine"><span></span><span class="engine-label">交易引擎已停止</span></div>
    </aside>
    <main>
      <div class="page">
        <div class="topline">
          <div><span class="eyebrow">策略中心 / 动态喊单</span><h1>交易配置预览</h1><p class="subtitle">账号触发方式保持动态，资金、买入和离场配置沿用固定 CA 的操作节奏。</p></div>
          <div class="top-actions"><span><i class="status-dot"></i>动态任务待命</span><button class="icon-button" title="刷新" aria-label="刷新"><i data-lucide="refresh-cw"></i></button></div>
        </div>
        <div class="workspace-head">
          <div><button class="back-link"><i data-lucide="arrow-left"></i>返回策略中心</button><h2>@cryptogle · 动态喊单策略</h2><p class="meta">跨多链账号 · <strong>交易配置预览</strong> · 当前为记录模式</p></div>
          <span class="badge">已启用 · 版本 2</span>
        </div>
        <div class="steps" aria-label="策略步骤">
          <button class="step"><span class="num">1</span><span><strong>触发对象</strong><small>账号、内容、词条</small></span></button>
          <button class="step active"><span class="num">2</span><span><strong>交易配置</strong><small>链、金额、限制</small></span></button>
          <button class="step"><span class="num">3</span><span><strong>离场策略</strong><small>条件单与保护</small></span></button>
          <button class="step"><span class="num">4</span><span><strong>确认保存</strong><small>验收与授权</small></span></button>
        </div>
        <p class="preview-label"><i data-lucide="eye"></i><b id="option-title">方案 A</b><span id="option-subtitle">适合 OGLE 这类经常跨多链喊单的账号，一屏比较和编辑全部链。</span></p>
        <div id="preview"></div>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const chains = [
      { id: 'sol', name: 'Solana', unit: 'SOL', mark: 'SOL', single: '0.0500', daily: '0.2500' },
      { id: 'bsc', name: 'BNB Smart Chain', unit: 'BNB', mark: 'BNB', single: '0.0100', daily: '0.0500' },
      { id: 'base', name: 'Base', unit: 'ETH', mark: 'BA', single: '0.0030', daily: '0.0150' },
      { id: 'eth', name: 'Ethereum', unit: 'ETH', mark: 'ETH', single: '0.0020', daily: '0.0100' },
      { id: 'robinhood', name: 'Robinhood Chain', unit: 'ETH', mark: 'RH', single: '0.0030', daily: '0.0150' }
    ];
    const templates = {
      standard: { name: '多链小额标准', ids: ['sol', 'bsc', 'base', 'eth', 'robinhood'], values: { sol: ['0.0500', '0.2500'], bsc: ['0.0100', '0.0500'], base: ['0.0030', '0.0150'], eth: ['0.0020', '0.0100'], robinhood: ['0.0030', '0.0150'] } },
      evm: { name: 'EVM 多链小额', ids: ['bsc', 'base', 'eth', 'robinhood'], values: { bsc: ['0.0100', '0.0500'], base: ['0.0030', '0.0150'], eth: ['0.0020', '0.0100'], robinhood: ['0.0030', '0.0150'] } },
      sol: { name: 'Solana 单链', ids: ['sol'], values: { sol: ['0.0500', '0.2500'] } },
      record: { name: '仅记录，不交易', ids: ['sol', 'bsc', 'base', 'eth', 'robinhood'], values: { sol: ['0', '0'], bsc: ['0', '0'], base: ['0', '0'], eth: ['0', '0'], robinhood: ['0', '0'] } }
    };
    let selectedTemplate = 'standard';
    let selectedChains = new Set(templates.standard.ids);
    let values = Object.fromEntries(chains.map((chain) => [chain.id, { single: chain.single, daily: chain.daily }]));
    let exitPreset = 'principal_no_stop';
    const exitPresets = [
      { id: 'principal_no_stop', name: '翻倍出本，无止损', detail: '+100% 卖 50% / 保留 50%', tp: '1 条', sl: '未设置', keep: '50%' },
      { id: 'principal_protected', name: '翻倍出本，带保护', detail: '+100% 卖 50% / -20% 保护', tp: '1 条', sl: '已设置 1 条', keep: '50%' },
      { id: 'conservative_staged', name: '保守分批', detail: '+50% / +100% / +200% / -15%', tp: '3 条', sl: '已设置 1 条', keep: '0%' },
      { id: 'standard_staged', name: '标准分段', detail: '+100% / +200% / +500% / -20%', tp: '3 条', sl: '已设置 1 条', keep: '0%' },
      { id: 'moonbag_trailing', name: '保留月亮包', detail: '10 倍激活 / 回撤 40% 卖尾仓', tp: '3 条', sl: '未设置', keep: '0%' },
      { id: 'full_trailing_protection', name: '全仓移动保护', detail: '+100% 激活 / 回撤 25% 全出', tp: '1 条', sl: '已设置 1 条', keep: '0%' }
    ];

    function icon(name) { return `<i data-lucide="${name}"></i>`; }
    function showToast(message) { const el = document.getElementById('toast'); el.textContent = message; el.classList.add('show'); window.clearTimeout(showToast.timer); showToast.timer = window.setTimeout(() => el.classList.remove('show'), 2200); }
    function applyTemplate(id) {
      const template = templates[id];
      selectedTemplate = id;
      selectedChains = new Set(template.ids);
      values = Object.fromEntries(chains.map((chain) => [chain.id, { single: template.values[chain.id]?.[0] || '0', daily: template.values[chain.id]?.[1] || '0' }]));
      render();
      showToast(`已应用「${template.name}」`);
    }
    function setPreset(kind) {
      const ids = kind === 'evm' ? ['bsc', 'base', 'eth', 'robinhood'] : kind === 'sol' ? ['sol'] : kind === 'clear' ? [] : chains.map((chain) => chain.id);
      selectedChains = new Set(ids);
      render();
    }
    function toggleChain(id) { if (selectedChains.has(id)) selectedChains.delete(id); else selectedChains.add(id); render(); }
    function updateValue(id, key, value) { values[id][key] = value; selectedTemplate = ''; render(); }
    function input(id, key, unit) { return `<div class="unit"><input class="input" inputmode="decimal" value="${values[id][key]}" data-chain="${id}" data-key="${key}" aria-label="${key === 'single' ? '单笔金额' : '每日上限'} ${unit}"><em>${unit}</em></div>`; }
    function header() { return `<div class="panel-head"><div><h3>资金与买入</h3><p>同固定 CA 的配置结构；动态策略按解析出的目标链读取对应金额。</p></div><span>不使用 USD 换算</span></div>`; }
    function commonRules() { return `<div class="section"><div class="section-head"><div><h3>共用交易规则</h3><p>所有已启用链共享，离场策略在下一步继续编辑。</p></div><span>固定 CA 交互</span></div><div class="rule-grid"><div class="rule"><span>滑点</span><strong>10%</strong><small>可在此处编辑</small></div><div class="rule"><span>重复买入</span><strong>关闭</strong><small>单币最多 1 次</small></div><div class="rule"><span>Gas 保护</span><strong>启用</strong><small>余额不足直接拒绝</small></div></div></div>`; }
    function exitSection() { const current = exitPresets.find((preset) => preset.id === exitPreset) || exitPresets[0]; return `<div class="section"><div class="section-head"><div><h3>离场策略</h3><p>与固定 CA 使用同一套止盈、止损和移动保护编辑器。</p></div><span>条件单最多 10 条</span></div><div class="exit-presets">${exitPresets.map((preset) => `<button class="exit-option ${preset.id === exitPreset ? 'active' : ''}" data-exit="${preset.id}"><strong>${preset.name}</strong><span>${preset.detail}</span>${icon('check')}</button>`).join('')}</div><div class="draft-summary"><div><span>当前草稿</span><strong>${current.tp} 止盈条件</strong></div><div><span>止损</span><strong>${current.sl}</strong></div><div><span>预计保留</span><strong>${current.keep}</strong></div></div><div class="custom-condition"><span>需要特殊规则时，可进入自定义条件编辑。</span><button class="button small" id="custom-exit">${icon('sliders-horizontal')}自定义条件</button></div></div>`; }
    function summary() { const enabled = chains.filter((chain) => selectedChains.has(chain.id)); const exit = exitPresets.find((preset) => preset.id === exitPreset) || exitPresets[0]; return `<div class="summary-list"><div><span>账号</span><strong>@cryptogle</strong></div><div><span>策略模板</span><strong>${templates[selectedTemplate]?.name || '当前自定义配置'}</strong></div><div><span>允许链</span><strong>${enabled.length ? enabled.map((chain) => chain.name === 'Robinhood Chain' ? 'Robinhood' : chain.unit === 'ETH' && chain.id !== 'base' && chain.id !== 'eth' ? chain.name : chain.id.toUpperCase()).join(' · ') : '未选择'}</strong></div><div><span>匹配方式</span><strong>完整 CA · $代币符号 · #话题标签</strong></div><div><span>运行阶段</span><strong>记录：仅记录</strong></div><div><span>离场策略</span><strong>${exit.name}</strong></div></div>`; }
    function matrixView() {
      return `<div class="shell"><div class="shell-head"><div><h2>交易配置</h2><p>多链账号一次完成配置；每条链使用自己的原生币金额。</p></div><span class="badge">方案 A</span></div><div class="workspace-grid"><section class="panel"><div class="panel-body">${header()}<div class="template-line"><label class="field"><span>交易模板</span><select class="select" id="template-select">${Object.entries(templates).map(([id, template]) => `<option value="${id}" ${selectedTemplate === id ? 'selected' : ''}>${template.name}</option>`).join('')}<option value="">当前自定义配置</option></select></label><div class="template-actions"><button class="button small" id="apply-template">${icon('check')}应用模板</button><button class="button small" id="save-template">${icon('save')}保存为模板</button></div></div><div class="preset-row"><span style="align-self:center;color:var(--quiet);font-size:11px">快速选择</span><button class="preset" data-preset="all">全选支持链</button><button class="preset" data-preset="evm">EVM 链</button><button class="preset" data-preset="sol">仅 Solana</button><button class="preset" data-preset="clear">清空</button></div><div class="chain-table"><div class="chain-row header"><span></span><span>链</span><span>单笔买入金额</span><span>每日动态上限</span><span>状态</span></div>${chains.map((chain) => `<div class="chain-row ${selectedChains.has(chain.id) ? '' : 'off'}"><input class="check" type="checkbox" data-toggle-chain="${chain.id}" ${selectedChains.has(chain.id) ? 'checked' : ''} aria-label="启用 ${chain.name}"><div class="chain-name"><span class="chain-mark">${chain.mark}</span><span><strong>${chain.name}</strong><small>原生币：${chain.unit}</small></span></div><label>${input(chain.id, 'single', chain.unit)}</label><label>${input(chain.id, 'daily', chain.unit)}</label><span class="row-status ${selectedChains.has(chain.id) && values[chain.id].single !== '0' ? '' : 'pending'}">${selectedChains.has(chain.id) && values[chain.id].single !== '0' ? '已配置' : '待配置'}</span></div>`).join('')}</div>${commonRules()}${exitSection()}</div></section><aside class="panel"><div class="panel-head"><div><h3>配置摘要</h3><p>保存前确认交易边界</p></div>${icon('clipboard-check')}</div><div class="panel-body">${summary()}<div class="notice">${icon('shield-check')}<span>策略只会在解析出唯一的“链 + CA”后读取对应链金额，不会因为全选链而重复买入。</span></div></div></aside></div><div class="footer"><small>当前 Revision 2 · 修改后需要重新完成 Paper 验收</small><div class="footer-actions"><button class="button ghost" id="cancel">取消</button><button class="button primary" id="save">${icon('save')}保存策略</button></div></div></div>`;
    }
    function bind() {
      const select = document.getElementById('template-select');
      if (select) select.addEventListener('change', (event) => { selectedTemplate = event.target.value; });
      document.querySelectorAll('[data-preset]').forEach((button) => button.addEventListener('click', () => setPreset(button.dataset.preset)));
      document.querySelectorAll('[data-toggle-chain]').forEach((inputEl) => inputEl.addEventListener('change', () => toggleChain(inputEl.dataset.toggleChain)));
      document.querySelectorAll('[data-chain][data-key]').forEach((inputEl) => inputEl.addEventListener('change', () => updateValue(inputEl.dataset.chain, inputEl.dataset.key, inputEl.value || '0')));
      document.getElementById('apply-template')?.addEventListener('click', () => applyTemplate(document.getElementById('template-select').value || 'standard'));
      document.getElementById('save-template')?.addEventListener('click', () => showToast('已保存为新的交易模板草稿'));
      document.querySelectorAll('[data-exit]').forEach((button) => button.addEventListener('click', () => { exitPreset = button.dataset.exit; render(); }));
      document.getElementById('custom-exit')?.addEventListener('click', () => showToast('自定义条件编辑沿用固定 CA 的编辑器'));
      document.getElementById('save')?.addEventListener('click', () => showToast('策略配置已保存，等待 Paper 验收'));
      document.getElementById('cancel')?.addEventListener('click', () => showToast('已保留当前草稿'));
      if (window.lucide) window.lucide.createIcons();
    }
    function render() { document.getElementById('preview').innerHTML = matrixView(); bind(); }
    render();
  </script>
</body>
</html>
