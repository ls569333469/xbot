<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XBOT 策略中心入口一致性预览</title>
  <style>
    :root {
      --bg: #0b0b0e;
      --panel: #111116;
      --panel-soft: #15151b;
      --panel-deep: #0e0e12;
      --line: #292930;
      --line-soft: #202026;
      --text: #f0f0f4;
      --muted: #8e8e99;
      --quiet: #64646d;
      --accent: #8b68ff;
      --accent-soft: rgba(139, 104, 255, .14);
      --green: #14e995;
      --amber: #f2b93e;
      --red: #ff6b78;
      --radius: 6px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--text); background: var(--bg); font: 13px/1.5 Inter, "Microsoft YaHei", system-ui, sans-serif; }
    button, a { font: inherit; }
    button { color: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .app { display: grid; grid-template-columns: 218px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: #09090c; }
    .brand { display: flex; align-items: center; gap: 10px; height: 65px; padding: 0 22px; border-bottom: 1px solid var(--line); font-size: 17px; font-weight: 760; }
    .brand-mark { display: grid; place-items: center; width: 26px; height: 26px; border: 1px solid #6550c7; border-radius: 6px; color: #c0b4ff; font-size: 11px; }
    .nav { display: grid; gap: 4px; padding: 18px 12px; }
    .nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-left: 2px solid transparent; color: var(--muted); }
    .nav a.active { border-left-color: var(--accent); color: var(--text); background: rgba(139, 104, 255, .08); }
    .nav-icon { width: 17px; color: var(--accent); text-align: center; }
    .engine { margin-top: auto; padding: 16px; border-top: 1px solid var(--line); color: var(--green); font-size: 12px; }
    .engine span { display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: currentColor; }
    main { min-width: 0; padding: 24px 30px 40px; }
    .page { width: min(1180px, 100%); margin: 0 auto; }
    .topline { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .eyebrow { color: #a991ff; font-size: 12px; font-weight: 700; }
    h1, h2, h3, p { margin: 0; }
    h1 { margin-top: 3px; font-size: 27px; letter-spacing: 0; }
    h2 { font-size: 18px; }
    h3 { font-size: 17px; }
    .subtitle { margin-top: 5px; color: var(--muted); font-size: 13px; }
    .top-actions { display: flex; align-items: center; gap: 14px; color: var(--muted); white-space: nowrap; }
    .status-dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--green); }
    .icon-button { display: inline-grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--muted); font-size: 17px; }
    .summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-bottom: 18px; border: 1px solid var(--line); background: var(--panel); }
    .summary-item { min-height: 86px; padding: 14px 16px; border-right: 1px solid var(--line); }
    .summary-item:last-child { border-right: 0; }
    .summary-item span, .summary-item small { display: block; color: var(--quiet); font-size: 11px; }
    .summary-item strong { display: block; margin: 8px 0 3px; font-size: 21px; line-height: 1; }
    .shell { overflow: hidden; border: 1px solid var(--line); background: var(--panel); }
    .shell-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 20px 22px; border-bottom: 1px solid var(--line); }
    .shell-head p { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .tabs { display: flex; gap: 4px; padding: 10px 14px 0; border-bottom: 1px solid var(--line); }
    .tab { min-height: 39px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); }
    .tab.active { border-bottom-color: var(--accent); color: var(--text); }
    .content { padding: 20px 22px 24px; }
    .view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 17px; }
    .view-head p { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-soft); color: var(--text); }
    .button.primary { border-color: var(--accent); background: var(--accent); color: white; }
    .button.ghost { color: var(--muted); background: transparent; }
    .button:hover { filter: brightness(1.12); }
    .split { display: grid; grid-template-columns: minmax(240px, .82fr) minmax(0, 1.5fr); min-height: 355px; border: 1px solid var(--line); }
    .list { border-right: 1px solid var(--line); background: var(--panel-deep); }
    .list-head { display: flex; justify-content: space-between; padding: 14px 15px; border-bottom: 1px solid var(--line); font-weight: 700; }
    .list-head span { color: var(--quiet); font-size: 11px; font-weight: 400; }
    .row { display: grid; grid-template-columns: 31px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line-soft); background: transparent; text-align: left; }
    .row:hover, .row.selected { background: var(--accent-soft); }
    .row-mark { display: grid; place-items: center; width: 29px; height: 29px; border: 1px solid #45404f; border-radius: var(--radius); color: #a991ff; font-family: ui-monospace, monospace; font-size: 10px; }
    .row strong, .row small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row strong { font-size: 12px; }
    .row small { margin-top: 3px; color: var(--quiet); font-size: 10px; }
    .row em { color: var(--green); font-size: 10px; font-style: normal; white-space: nowrap; }
    .detail { padding: 23px; }
    .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .detail-head p { margin-top: 4px; color: var(--quiet); font-family: ui-monospace, monospace; font-size: 11px; }
    .badge { padding: 4px 8px; border: 1px solid rgba(20, 233, 149, .35); border-radius: var(--radius); color: var(--green); font-size: 10px; white-space: nowrap; }
    .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 22px; padding: 20px 0; }
    .metric span { display: block; color: var(--quiet); font-size: 11px; }
    .metric strong { display: block; margin-top: 4px; font-size: 13px; }
    .metric.wide { grid-column: 1 / -1; }
    .notice { display: flex; gap: 8px; padding: 10px 11px; border: 1px solid rgba(139, 104, 255, .28); border-radius: var(--radius); color: var(--muted); background: var(--accent-soft); font-size: 11px; line-height: 1.5; }
    .actions { display: flex; gap: 8px; margin-top: 19px; }
    .runtime { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: -3px 0 16px; color: var(--muted); font-size: 11px; }
    .runtime span::before { content: ''; display: inline-block; width: 6px; height: 6px; margin: 0 5px 1px 0; border-radius: 50%; background: var(--accent); }
    .workspace { display: grid; gap: 18px; }
    .workspace-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 13px; color: var(--muted); font-size: 12px; }
    .workspace-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .workspace-title p { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .workspace-band { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); background: var(--panel-deep); }
    .workspace-band > div { min-height: 76px; padding: 13px 15px; border-right: 1px solid var(--line); }
    .workspace-band > div:last-child { border-right: 0; }
    .workspace-band span, .workspace-band small { display: block; color: var(--quiet); font-size: 11px; }
    .workspace-band strong { display: block; margin: 7px 0 2px; font-size: 16px; }
    .editor-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr); gap: 18px; }
    .editor-panel { border: 1px solid var(--line); background: var(--panel); }
    .editor-panel-head { display: flex; justify-content: space-between; padding: 14px 15px; border-bottom: 1px solid var(--line); }
    .editor-panel-head span { color: var(--quiet); font-size: 11px; }
    .editor-body { padding: 15px; }
    .fake-select, .fake-input { display: flex; justify-content: space-between; align-items: center; min-height: 36px; margin-bottom: 10px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); background: var(--panel-deep); }
    .fake-select strong, .fake-input strong { color: var(--text); font-weight: 500; }
    .check-row { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 12px 0; color: var(--muted); font-size: 11px; }
    .check-row b { color: var(--text); font-weight: 500; }
    .clean-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
    .clean-item small { display: block; margin-top: 3px; color: var(--quiet); }
    .clean-score { color: var(--green); font-size: 12px; }
    .preview-note { margin-top: 18px; color: var(--quiet); font-size: 11px; }
    @media (max-width: 900px) { .app { grid-template-columns: 72px minmax(0, 1fr); } .brand { justify-content: center; padding: 0; } .brand-label, .nav-label, .engine-label { display: none; } .nav a { justify-content: center; padding: 11px; } .engine { text-align: center; } main { padding: 20px 16px 32px; } .summary { grid-template-columns: repeat(3, 1fr); } .summary-item:nth-child(3) { border-right: 0; } .summary-item:nth-child(n + 4) { border-top: 1px solid var(--line); } .workspace-band { grid-template-columns: repeat(2, 1fr); } .workspace-band > div:nth-child(2) { border-right: 0; } .workspace-band > div:nth-child(n + 3) { border-top: 1px solid var(--line); } }
    @media (max-width: 680px) { .topline, .shell-head, .view-head, .workspace-title { flex-direction: column; align-items: flex-start; } .top-actions { width: 100%; justify-content: space-between; } .summary { grid-template-columns: repeat(2, 1fr); } .summary-item:nth-child(odd) { border-right: 1px solid var(--line); } .summary-item:nth-child(n + 3) { border-top: 1px solid var(--line); } .tabs { overflow-x: auto; } .tab { flex: 0 0 auto; } .split, .editor-grid { grid-template-columns: 1fr; } .list { border-right: 0; border-bottom: 1px solid var(--line); } .metrics { grid-template-columns: 1fr; } .metric.wide { grid-column: auto; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">XB</span><span class="brand-label">xbot.</span></div>
      <nav class="nav">
        <a href="#"><span class="nav-icon">◈</span><span class="nav-label">总览</span></a>
        <a href="#" class="active"><span class="nav-icon">≡</span><span class="nav-label">策略中心</span></a>
        <a href="#"><span class="nav-icon">◎</span><span class="nav-label">KOL</span></a>
        <a href="#"><span class="nav-icon">⌁</span><span class="nav-label">信号</span></a>
        <a href="#"><span class="nav-icon">↗</span><span class="nav-label">持仓</span></a>
        <a href="#"><span class="nav-icon">◷</span><span class="nav-label">交易记录</span></a>
        <a href="#"><span class="nav-icon">⚙</span><span class="nav-label">设置</span></a>
      </nav>
      <div class="engine"><span></span><span class="engine-label">交易引擎已停止</span></div>
    </aside>
    <main>
      <div class="page" id="app-content"></div>
    </main>
  </div>
  <script>
    const fixedTargets = [
      { mark: 'RO', name: 'ROBINHOOD', sub: 'Robinhood · 固定 CA', detail: 'Robinhood · 0x8f100e...d47382', actors: '15 个唯一账号', relation: '15 条生态互动', status: '运行中' },
      { mark: 'RH', name: 'RHAGENT', sub: 'Robinhood · 固定 CA', detail: 'Robinhood · 0x1a0f27...9c01a4', actors: '6 个唯一账号', relation: '6 条生态互动', status: '运行中' },
      { mark: 'GW', name: 'GWOOD', sub: 'Robinhood · 未发币项目', detail: 'Robinhood · 项目身份监控', actors: '4 个项目账号', relation: '8 条生态互动', status: '监控中' }
    ];
    const dynamicPolicies = [
      { mark: 'CZ', name: '@cz_binance', mode: '记录', state: '已启用', terms: 'CA / $Cashtag / #话题', chains: 'BSC · SOL' },
      { mark: 'VL', name: '@vladtenev', mode: '模拟', state: '待验收', terms: 'CA / 项目名称', chains: 'Robinhood' },
      { mark: 'UP', name: '@theunipcs', mode: '暂停', state: '已暂停', terms: 'CA / $Cashtag', chains: 'SOL · Robinhood' }
    ];
    let currentTab = 'fixed';
    let currentView = 'center';
    let selectedFixed = 0;

    function button(label, className, action) { return `<button class="button ${className || ''}" data-action="${action}">${label}</button>`; }
    function renderSummary() {
      return `<section class="summary">
        <div class="summary-item"><span>全部策略</span><strong>33</strong><small>固定 30 · 动态 3</small></div>
        <div class="summary-item"><span>固定目标</span><strong>30</strong><small>CA、项目和生态关系</small></div>
        <div class="summary-item"><span>动态账号</span><strong>3</strong><small>记录 1 · 模拟 1 · 暂停 1</small></div>
        <div class="summary-item"><span>模拟验收</span><strong>1</strong><small>修改后需重新验收</small></div>
        <div class="summary-item"><span>实盘授权</span><strong>0</strong><small>未开启动态实盘</small></div>
      </section>`;
    }
    function renderTabs() {
      return `<nav class="tabs" aria-label="策略类型">
        <button class="tab ${currentTab === 'fixed' ? 'active' : ''}" data-tab="fixed">固定 CA / 项目策略</button>
        <button class="tab ${currentTab === 'dynamic' ? 'active' : ''}" data-tab="dynamic">动态喊单策略</button>
      </nav>`;
    }
    function fixedCenter() {
      const item = fixedTargets[selectedFixed];
      return `<section class="content">
        <div class="view-head"><div><h2>固定 CA / 项目策略</h2><p>管理已知 CA、未发币项目和生态互动。</p></div>${button('进入固定策略工作区  →', 'primary', 'fixed-workspace')}</div>
        <div class="split"><div class="list"><div class="list-head">固定目标列表 <span>30 条</span></div>${fixedTargets.map((target, index) => `<button class="row ${selectedFixed === index ? 'selected' : ''}" data-fixed="${index}"><span class="row-mark">${target.mark}</span><span><strong>${target.name}</strong><small>${target.sub}</small></span><em>${target.status}</em></button>`).join('')}</div>
          <div class="detail"><div class="detail-head"><div><span class="eyebrow">固定 CA</span><h3>${item.name}</h3><p>${item.detail}</p></div><span class="badge">${item.status}</span></div>
            <div class="metrics"><div class="metric"><span>触发账号</span><strong>${item.actors}</strong></div><div class="metric"><span>生态互动</span><strong>${item.relation}</strong></div><div class="metric"><span>单笔 / 上限</span><strong>0.10000000 / 0.20000000</strong></div><div class="metric"><span>离场策略</span><strong>+100% 卖 50%</strong></div><div class="metric wide"><span>链路边界</span><strong>固定目标不经过动态 CA 解析，沿用 6551 Watch 和 P19 交易链路。</strong></div></div>
            <div class="notice">▣　固定策略只处理已知 CA、项目身份和生态互动，不与动态喊单策略共用触发对象。</div><div class="actions">${button('编辑固定策略  →', 'primary', 'fixed-workspace')}${button('复制 CA', 'ghost', 'noop')}</div>
          </div>
        </div>
      </section>`;
    }
    function dynamicCenter() {
      return `<section class="content">
        <div class="view-head"><div><h2>动态喊单策略</h2><p>账号发帖后才解析 CA，动态解析结果不会修改固定 CA / 项目策略。</p></div>${button('进入动态喊单工作区  →', 'primary', 'dynamic-workspace')}</div>
        <div class="runtime"><span>解析任务：运行中</span><span>模拟任务：运行中</span><span>动态策略：3 条</span><span>实盘授权：0 条</span></div>
        <div class="split"><div class="list"><div class="list-head">账号策略列表 <span>3 条</span></div>${dynamicPolicies.map((policy) => `<div class="row"><span class="row-mark">${policy.mark}</span><span><strong>${policy.name}</strong><small>${policy.mode} · ${policy.terms}</small></span><em>${policy.state}</em></div>`).join('')}</div>
          <div class="detail"><div class="detail-head"><div><span class="eyebrow">账号级策略</span><h3>3 个账号已配置</h3><p>动态喊单工作区负责规则编辑、账号清洗和验收。</p></div><span class="badge">独立授权</span></div>
            <div class="metrics"><div class="metric"><span>匹配来源</span><strong>CA / $Cashtag / #话题 / 项目名称</strong></div><div class="metric"><span>解析方式</span><strong>先解析，后验收，再决定阶段</strong></div><div class="metric"><span>记录策略</span><strong>1 条</strong></div><div class="metric"><span>模拟策略</span><strong>1 条</strong></div><div class="metric wide"><span>安全边界</span><strong>动态策略不会覆盖固定 CA、项目关系或生态互动策略。</strong></div></div>
            <div class="notice">▣　动态策略只有在独立工作区中编辑、保存、验收和授权，避免与固定策略混在同一页面。</div><div class="actions">${button('编辑动态喊单策略  →', 'primary', 'dynamic-workspace')}</div>
          </div>
        </div>
      </section>`;
    }
    function workspace(type) {
      const dynamic = type === 'dynamic';
      return `<section class="content workspace">
        <div>${button('← 返回策略中心', 'ghost', 'center')}</div>
        <div class="workspace-title"><div><span class="eyebrow">${dynamic ? '动态策略工作区' : '固定策略工作区'}</span><h2>${dynamic ? '动态喊单策略' : '固定 CA / 项目策略'}</h2><p>${dynamic ? '管理账号级匹配规则、解析任务、模拟验收和实盘授权。' : '管理 CA、项目身份、生态账号互动和固定策略参数。'}</p></div><span class="badge">${dynamic ? '动态任务运行中' : '固定策略运行中'}</span></div>
        <div class="workspace-band"><div><span>${dynamic ? 'KOL 账号' : '固定目标'}</span><strong>${dynamic ? '12' : '30'}</strong><small>${dynamic ? '可配置账号' : '已配置策略'}</small></div><div><span>${dynamic ? '解析任务' : '6551 Watch'}</span><strong>${dynamic ? '运行中' : '15 个'}</strong><small>${dynamic ? '实时队列' : '同步正常'}</small></div><div><span>${dynamic ? '模拟任务' : '生态互动'}</span><strong>${dynamic ? '运行中' : '15 条'}</strong><small>${dynamic ? '独立于固定策略' : '触发关系'}</small></div><div><span>安全边界</span><strong>${dynamic ? '独立授权' : '固定链路'}</strong><small>${dynamic ? '不会自动开启实盘' : '不经过动态解析'}</small></div></div>
        <div class="editor-grid"><div class="editor-panel"><div class="editor-panel-head"><strong>${dynamic ? '账号级策略' : '固定目标配置'}</strong><span>${dynamic ? 'P20' : 'P16 / P19'}</span></div><div class="editor-body">${dynamic ? `<div class="fake-select"><span>选择 X 账号</span><strong>@cz_binance　⌄</strong></div><div class="fake-select"><span>运行阶段</span><strong>记录：仅记录　⌄</strong></div><div class="check-row"><b>允许链</b> SOL　 BSC　 Robinhood　 ETH</div><div class="check-row"><b>匹配词条</b> 完整 CA　 $Cashtag　 #话题　 项目名称</div><div class="fake-input"><span>共用离场策略</span><strong>+100% 卖 50%</strong></div>` : `<div class="fake-input"><span>目标类型</span><strong>固定 CA / 项目关系</strong></div><div class="fake-input"><span>触发账号</span><strong>15 个唯一账号</strong></div><div class="check-row"><b>生态来源</b> 已选择 15 个账号　 <b>互动规则</b> 已启用</div><div class="fake-input"><span>资金与离场</span><strong>0.10000000 / +100% 卖 50%</strong></div>`}<div class="actions">${button('保存策略', 'primary', 'noop')}${button('取消', 'ghost', 'center')}</div></div></div><div class="editor-panel"><div class="editor-panel-head"><strong>${dynamic ? '账号清洗' : '链路检查'}</strong><span>${dynamic ? '统计胜率' : '实时状态'}</span></div><div class="editor-body">${dynamic ? `<div class="clean-item"><div><strong>@cz_binance</strong><small>样本 80 · CA 解析率 71%</small></div><span class="clean-score">胜率 62%</span></div><div class="clean-item"><div><strong>@vladtenev</strong><small>样本 42 · 待模拟验收</small></div><span class="clean-score">胜率 48%</span></div><div class="clean-item"><div><strong>@theunipcs</strong><small>样本不足 · 继续观察</small></div><span class="clean-score">数据不足</span></div>` : `<div class="clean-item"><div><strong>6551 Watch</strong><small>账号监听与去重</small></div><span class="clean-score">正常</span></div><div class="clean-item"><div><strong>交易链路</strong><small>资金、风控、离场策略</small></div><span class="clean-score">正常</span></div><div class="clean-item"><div><strong>安全门</strong><small>实盘需独立授权</small></div><span class="clean-score">已锁定</span></div>`}</div></div></div>
        <p class="preview-note">预览交互：两个策略入口都先进入策略中心总览，再进入各自独立工作区；不代表已连接后端。</p>
      </section>`;
    }
    function render() {
      const content = document.getElementById('app-content');
      const body = currentView === 'center' ? `${renderSummary()}<section class="shell"><header class="shell-head"><div><span class="eyebrow">统一策略入口</span><h1>策略中心</h1><p>固定 CA、项目关系和动态喊单使用同一套资金、风控与离场标准。</p></div><div class="top-actions"><span><i class="status-dot"></i>动态任务运行中</span><button class="icon-button" data-action="noop" aria-label="刷新">↻</button></div></header>${renderTabs()}${currentTab === 'fixed' ? fixedCenter() : dynamicCenter()}</section>` : workspace(currentView);
      content.innerHTML = `<div class="topline"><div><span class="eyebrow">XBOT 操作台 · 入口一致性预览</span><h1>策略中心</h1><p class="subtitle">先看策略总览，再进入对应工作区。</p></div></div>${body}`;
      bind();
    }
    function bind() {
      document.querySelectorAll('[data-tab]').forEach((element) => element.addEventListener('click', () => { currentTab = element.dataset.tab; currentView = 'center'; render(); }));
      document.querySelectorAll('[data-fixed]').forEach((element) => element.addEventListener('click', () => { selectedFixed = Number(element.dataset.fixed); render(); }));
      document.querySelectorAll('[data-action]').forEach((element) => element.addEventListener('click', () => { const action = element.dataset.action; if (action === 'center') currentView = 'center'; if (action === 'fixed-workspace') currentView = 'fixed'; if (action === 'dynamic-workspace') currentView = 'dynamic'; render(); }));
    }
    render();
  </script>
</body>
</html>
